name: Executar Ponto Google Planilha

on:
  schedule:
    # TESTE: Rodar hoje às 11:35 Brasília (14:35 UTC)
    - cron: '35 14 * * *'
  workflow_dispatch:  # Permite executar manualmente também

jobs:
  executar-ponto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Pegar código do repositório
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependências
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Executar script principal
      run: python main.py
      
    - name: Mostrar horário da execução
      run: |
        echo "Executado em: $(date)"
        echo "Horário UTC: $(date -u)"
