name: Executar Ponto Google Planilha

on:
  schedule:
    # Roda todo dia às 08:00 Brasília (11:00 UTC)
    - cron: '0 11 * * 1-5'  # Segunda a sexta
  workflow_dispatch:  # Permite execução manual

jobs:
  executar-ponto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Pegar código do repositório
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependências do sistema (Chrome)
      run: |
        # Instalar Chrome
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable xvfb
        
        echo "✅ Chrome instalado:"
        google-chrome --version
        
    - name: Criar arquivo .env com os secrets
      run: |
        echo "EMAIL_SISTEMA=${{ secrets.EMAIL_SISTEMA }}" >> .env
        echo "SENHA_SISTEMA=${{ secrets.SENHA_SISTEMA }}" >> .env
        echo "GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}" >> .env
        echo "✅ Arquivo .env criado"
        
    - name: Criar pasta config e arquivos de credenciais
      run: |
        mkdir -p config
        echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > config/credentials.json
        echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > config/token.json
        echo "✅ Credenciais do Google criadas"
        
    - name: Instalar dependências Python
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Executar script principal
      env:
        GITHUB_ACTIONS: true
        DISPLAY: :99
      run: |
        # Iniciar Xvfb (servidor X virtual)
        Xvfb :99 -screen 0 1920x1080x24 &
        python main.py
