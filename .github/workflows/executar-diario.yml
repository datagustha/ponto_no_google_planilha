name: Executar Ponto Google Planilha

on:
  schedule:
    - cron: '35 14 * * *'
  workflow_dispatch:

jobs:
  executar-ponto:
    runs-on: ubuntu-latest
    
    steps:
    - name: Pegar código do repositório
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Criar arquivo .env a partir do secret
      run: |
        echo "${{ secrets.DOTENV }}" > .env
        echo "✅ Arquivo .env criado com sucesso"
        
    - name: Instalar dependências
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Executar script principal (sem input)
      run: python main.py --no-input
      # OU, se não tiver essa flag, vamos modificar o script
