# .github/workflows/testar_idioma.yml
name: Testar Idioma

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-idioma:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager python-dotenv
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Criar arquivo .env com secrets
      run: |
        echo "PONTOMAIS_USER=${{ secrets.PONTOMAIS_USER }}" >> .env
        echo "PONTOMAIS_PASS=${{ secrets.PONTOMAIS_PASS }}" >> .env
    
    - name: Executar diagnóstico
      run: python diagnosticar_idioma.py
    
    - name: Upload screenshots
      uses: actions/upload-artifact@v4  # Mudado para v4
      if: always()
      with:
        name: screenshots
        path: screenshots/
        retention-days: 7
