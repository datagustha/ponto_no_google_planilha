# .github/workflows/testar_idioma.yml
name: Testar Idioma

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permite executar manualmente

jobs:
  test-idioma:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Diagnosticar idioma
      run: python diagnosticar_idioma.py
