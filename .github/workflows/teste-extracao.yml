name: TESTE - Extração de Dados

on:
  workflow_dispatch:  # Só executa manualmente

jobs:
  teste-extracao:
    runs-on: ubuntu-latest
    
    steps:
    - name: Pegar código
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Criar .env com secrets
      run: |
        echo "EMAIL_SISTEMA=${{ secrets.EMAIL_SISTEMA }}" >> .env
        echo "SENHA_SISTEMA=${{ secrets.SENHA_SISTEMA }}" >> .env
        echo "GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}" >> .env
        
    - name: Configurar credenciais Google
      run: |
        mkdir -p config
        echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > config/token.json
        
    - name: Instalar dependências Python
      run: |
        pip install -r requirements.txt
        
    - name: Executar TESTE de extração
      env:
        GITHUB_ACTIONS: true
      run: python teste_local_github.py
      
    - name: Upload dos resultados do teste
      if: always()  # Mesmo se falhar, faz upload
      uses: actions/upload-artifact@v4
      with:
        name: resultados-teste
        path: |
          teste_extracao.csv
          debug_*.html
          debug_*.png
          *.log
        retention-days: 7
